mutation InsertAppointment($data: Appointment_Data!) @auth(level: USER) {
  appointment_insert(data: $data)
}

mutation UpsertAppointment($data: Appointment_Data!) @auth(level: USER) {
  appointment_upsert(data: $data)
}

mutation DeleteAppointment($id: UUID!) @auth(level: USER) {
  appointment_delete(id: $id)
}

mutation UpdateAppointment($id: UUID!, $data: Appointment_Data!) @auth(level: USER) {
  appointment_update(id: $id, data: $data)
}

query GetAppointment($id: UUID!) @auth(level: USER) {
  appointment(id: $id) {
    status
    totalCost
  }
}

query ListAppointments @auth(level: USER) {
  appointments(where: { _or: [{ customerId: { eq_expr: "auth.uid" } }, { providerId: { eq_expr: "auth.uid" } }] }) {
    status
    scheduledTime
  }
}

